services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/topic/Dockerfile
    env_file: ../../backend/.env
    environment:
      TOPIC_METHOD: bertopic
    ports:
      - '127.0.0.1:5000:5000'
    volumes:
      - model-cache:/models
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  model-cache:
